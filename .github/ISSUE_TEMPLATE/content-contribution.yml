name: Content contribution
description: Submit a UniversalisRPG local-changes DSL module.
title: "[Content]: "
labels: ["content", "community", "mod-pending"]
body:
  - type: input
    id: universe
    attributes:
      label: Target universe
      description: Which universe should this content change?
      placeholder: base
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What does this contribution add or change?
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation status
      description: Paste the validation summary generated by the contribution tooling.
    validations:
      required: true
  - type: textarea
    id: dsl
    attributes:
      label: Local changes DSL
      description: Paste the full local-changes module, including its # info header.
      render: dsl
    validations:
      required: true
