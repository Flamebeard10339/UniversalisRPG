name: Test

# Two gates, because there are two jobs in this repository and neither one's
# gate answers for the other. The suite gates the engine and reads no line of
# `content/`; the oracle gates the world an author writes, and is the only
# thing that does — a contributor editing it in the game cannot run vitest, so
# a check they cannot run is a check nobody can answer. `docs/authoring-split/`
# and the top of `CLAUDE.md` say why.
#
# Until this workflow existed nothing ran either outside a developer's machine —
# publish.yml only runs `npm run build` on a tag push. Kept separate from
# publish so a red gate reports on the commit that broke it rather than waiting
# for a release.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    # Both platforms, because the DSL is line-ending sensitive and the authoring
    # path is pasting through a GitHub issue: a Windows checkout is a real
    # configuration this content has to parse in, and ubuntu alone cannot see it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run layer-check
      - run: npm run comment-check
      # The corpus's whole verdict: every line the engine has something to say
      # about, whether it loads, whether it prints back to itself, whether every
      # route it holds still walks, and anything it takes that an author probably
      # did not mean. It exits non-zero on any of them.
      - run: npm run oracle -- --at content
