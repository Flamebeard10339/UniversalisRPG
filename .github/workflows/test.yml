name: Test

# The suite gates the resolver's associativity invariant, among much else, and
# until this workflow existed nothing ran it outside a developer's machine —
# publish.yml only runs `npm run build` on a tag push. Kept separate from
# publish so a red test reports on the commit that broke it rather than waiting
# for a release.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Full history: audit-status walks back to each system's lastAudit SHA,
      # which a shallow clone does not contain.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run comment-budget
      - run: npm run layer-check
      - run: npm run audit-status
