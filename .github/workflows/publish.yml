name: Publish

on:
  push:
    tags: ['v*']

# Least privilege by default; the android job raises its own to attach the APK.
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Pinned by commit, not by tag: this step reads the itch.io credentials,
      # and a moved tag would hand them to code nobody here reviewed.
      - name: Push to itch.io
        uses: josephbmanley/butler-publish-itchio-action@cb6573e42b67220c61a15b80d9b6e7ed7a68929c # v1.0.3
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: html5
          ITCH_GAME: universalis-rpg
          ITCH_USER: Flamebeard10339
          PACKAGE: dist

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attaching the APK to the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run sync
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Sign APK
        uses: r0adkll/sign-android-release@349ebdef58775b1e0d8099458af0816dc79b6407 # v1
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          files: android/app/build/outputs/apk/release/*-signed.apk
